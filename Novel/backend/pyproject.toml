[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-agent-platform-backend"
version = "0.1.0"
description = "M1 runtime foundation for Novel Agent Platform"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.14.0",
  "arq==0.26.1",
  "asyncpg==0.30.0",
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "jsonschema==4.23.0",
  "pgvector==0.3.6",
  "pydantic-settings==2.7.1",
  "PyYAML==6.0.2",
  "redis==5.2.1",
  "sqlalchemy[asyncio]==2.0.36",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires the native PostgreSQL and Redis services",
]
